# Container configuration for the published static site.
#
# The product is build-free: `docs/` is copied verbatim into the image and
# served as-is. This mirrors the production headers in `vercel.json`; the two
# files are the only place where delivery headers are declared.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json application/manifest+json image/svg+xml;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/plain text/xml application/javascript application/json application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    error_page 404 /404.html;

    # Documents revalidate; the artifact has no content hash to cache-bust.
    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        default_type application/xml;
        try_files $uri =404;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~* \.(css|js|svg|webmanifest|png|jpg|webp|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Same artifact, served by the dependency-free Python server used in CI.
  # docker compose --profile dev up docs-dev
  docs-dev:
    image: python:3.13-alpine
    working_dir: /site
    volumes:
      - ./docs:/site/docs:ro
      - ./scripts/serve_docs.py:/site/scripts/serve_docs.py:ro
    command: ["python3", "scripts/serve_docs.py", "--root", "docs", "--port", "4173", "--bind", "0.0.0.0"]
    ports:
      - "4173:4173"
    profiles:
      - dev

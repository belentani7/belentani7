name: Deploy project landing page

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "!docs/**/*.test.cjs"
      - "scripts/pages_preflight.py"
      - "tests/test_pages_preflight.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      ready: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify publishing readiness without modifying repository settings
        id: pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/pages_preflight.py

  deploy:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout verified main
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify static site contents
        run: |
          test -s docs/index.html
          test -s docs/living-machine/index.html
          test -s docs/living-machine/studio.html
      - name: Configure GitHub Pages without auto-enablement
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy project landing page
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'index.html'
      - 'scripts/publish_project_sites.py'
      - 'scripts/wait_legacy_pages.py'
      - 'tests/test_pages_order.py'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'index.html'
      - 'scripts/publish_project_sites.py'
      - 'scripts/wait_legacy_pages.py'
      - 'tests/test_pages_order.py'
      - 'tests/test_project_publication.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify profile and publication contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Checkout verified Secure-T source
        uses: actions/checkout@v7
        with:
          repository: belentani7/secure-t
          ref: bdeea94019cd3ac4e776c682da8f84ebcc784c80
          path: .published-sources/secure-t
          persist-credentials: false
      - name: Checkout verified MUSIC OS source
        uses: actions/checkout@v7
        with:
          repository: belentani7/music-os-pedro-belentani
          ref: fd252485824efb2140b2230c587038d1da751447
          path: .published-sources/music-os
          persist-credentials: false
      - name: Assemble public artifacts without copying repositories or local history
        run: python scripts/publish_project_sites.py --sources-root .published-sources
      - name: Verify static site contents
        run: |
          test -s docs/index.html
          test -s docs/living-machine/index.html
          test -s docs/living-machine/studio.html
          test -s docs/projects/secure-t/campus/index.html
          test -s docs/projects/music-os/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Let the legacy branch deployment finish before publishing the complete artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/wait_legacy_pages.py --repository "$GITHUB_REPOSITORY" --head "$GITHUB_SHA"
      - name: Require the existing Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "/repos/$GITHUB_REPOSITORY/pages" --silent; then
            echo "::error title=GitHub Pages configuration required::Enable Pages in repository settings, then rerun workflow_dispatch. No extra deployment secrets are required."
            exit 1
          fi
      - name: Configure GitHub Pages without auto-enablement
        uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

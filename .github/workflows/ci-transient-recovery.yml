name: CI Transient Runner Recovery

on:
  workflow_run:
    workflows: [CI, Build, Quality, CodeQL Analysis, Repository Security]
    types: [completed]

# Can only re-run Actions jobs; cannot modify code, create PRs or deploy.
# The event is treated as untrusted. Check out only reviewed main code.
permissions:
  actions: write
  contents: read

concurrency:
  group: ci-runner-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout vetted main branch only (no triggering-run artifacts)
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Policy tests before using write-scoped Actions token
        run: python -m unittest discover -s tests -p test_ci_recovery.py -v
      - name: Retry exactly once ONLY when all failures occurred during runner setup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci_recovery.py

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run quality tests
        run: npm test
      - name: Secret scan (gitleaks)
        run: npx gitleaks protect --source . --verbose --log-opts='' || true
      - name: Build verification
        run: |
          echo "Verificación de estructura crítica:"
          ls -la README.md package.json .github/CODEOWNERS

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">BELENTANI LIVING MACHINE — interactive profile terminal preview</title>
<desc id="desc">An animated black-glass console introducing Pedro Belentani's AI systems, product engineering, trust and safety and creative technology. This is a preview; click the banner to explore the source and browser tools.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#05050b"/><stop offset=".55" stop-color="#0b0d15"/><stop offset="1" stop-color="#140510"/></linearGradient>
<linearGradient id="frame" x2="1" y2="1"><stop stop-color="#f0f5ff" stop-opacity=".36"/><stop offset=".4" stop-color="#ef2a5f" stop-opacity=".66"/><stop offset="1" stop-color="#3a1828"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#fa2256" stop-opacity=".25"/><stop offset="1" stop-color="#fa2256" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern>
<filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
<style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
.dash{fill:#ff4778}.cmd{fill:#e7efff}.out{fill:#9babc2}.key{fill:#ff8cab}.muted{fill:#617289}
.cursor{animation:blink 1s step-end infinite}.pulse{animation:pulse 5s ease-in-out infinite}
@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.6}}
@media(prefers-reduced-motion:reduce){.cursor,.pulse{animation:none}}
</style>
</defs>
<rect width="1200" height="520" rx="25" fill="url(#bg)"/>
<rect width="1200" height="520" rx="25" fill="url(#grid)"/>
<ellipse class="pulse" cx="1002" cy="320" rx="280" ry="200" fill="url(#glow)"/>
<rect x="2" y="2" width="1196" height="516" rx="23" fill="none" stroke="url(#frame)" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="t d">
  <title id="t">Pedro Belentani — terminal</title>
  <desc id="d">Terminal de cristal con neón rojo: arquitecto de sistemas de IA, full-stack y tecnología creativa. Barcelona.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070a"/>
      <stop offset="1" stop-color="#140308"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#ff0040" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0040"/>
      <stop offset=".5" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#ff0040"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity=".035"/>
    </pattern>
    <clipPath id="win"><rect x="40" y="30" width="880" height="280" rx="18"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .rain{font-size:13px;fill:#ff0040;opacity:.16}
      .c1{animation:fall 7s linear infinite}
      .c2{animation:fall 9s linear infinite -3s}
      .c3{animation:fall 6s linear infinite -1s}
      .c4{animation:fall 11s linear infinite -5s}
      .c5{animation:fall 8s linear infinite -2s}
      @keyframes fall{from{transform:translateY(-260px)}to{transform:translateY(300px)}}
      .line{font-size:17px;fill:#e8e8ee}
      .p{fill:#ff2e5b}.k{fill:#ff8fa3}.m{fill:#9a9aa8}.w{fill:#ffffff;font-weight:700}
      .type{clip-path:inset(0 100% 0 0);animation:type 1.1s steps(38,end) forwards}
      .l1{animation-delay:.3s}.l2{animation-delay:1.6s}.l3{animation-delay:2.9s}.l4{animation-delay:4.2s}.l5{animation-delay:5.5s}
      @keyframes type{to{clip-path:inset(0 0 0 0)}}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 3.2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      .sweep{animation:sweep 5s ease-in-out infinite}
      @keyframes sweep{0%{transform:translateX(-300px)}60%,100%{transform:translateX(1100px)}}
      @media (prefers-reduced-motion:reduce){.type{clip-path:none;animation:none}.c1,.c2,.c3,.c4,.c5,.sweep,.pulse,.cursor{animation:none}}
    </style>
  </defs>

  <rect width="960" height="340" fill="url(#bg)"/>
  <circle cx="820" cy="60" r="140" fill="#ff0040" opacity=".22" filter="url(#soft)" class="pulse"/>
  <circle cx="120" cy="300" r="120" fill="#ff0040" opacity=".12" filter="url(#soft)"/>

  <!-- ventana de cristal -->
  <rect x="40" y="30" width="880" height="280" rx="18" fill="url(#glass)"/>
  <g clip-path="url(#win)">
    <g class="mono rain">
      <text x="560" y="0" class="c1">1<tspan x="560" dy="18">0</tspan><tspan x="560" dy="18">Ω</tspan><tspan x="560" dy="18">1</tspan><tspan x="560" dy="18">λ</tspan><tspan x="560" dy="18">0</tspan><tspan x="560" dy="18">{</tspan><tspan x="560" dy="18">}</tspan></text>
      <text x="640" y="0" class="c2">&lt;<tspan x="640" dy="18">/</tspan><tspan x="640" dy="18">&gt;</tspan><tspan x="640" dy="18">1</tspan><tspan x="640" dy="18">0</tspan><tspan x="640" dy="18">Ω</tspan><tspan x="640" dy="18">1</tspan></text>
      <text x="720" y="0" class="c3">λ<tspan x="720" dy="18">1</tspan><tspan x="720" dy="18">0</tspan><tspan x="720" dy="18">;</tspan><tspan x="720" dy="18">=</tspan><tspan x="720" dy="18">&gt;</tspan><tspan x="720" dy="18">0</tspan><tspan x="720" dy="18">1</tspan></text>
      <text x="800" y="0" class="c4">0<tspan x="800" dy="18">1</tspan><tspan x="800" dy="18">{</tspan><tspan x="800" dy="18">Ω</tspan><tspan x="800" dy="18">}</tspan><tspan x="800" dy="18">1</tspan></text>
      <text x="870" y="0" class="c5">1<tspan x="870" dy="18">λ</tspan><tspan x="870" dy="18">0</tspan><tspan x="870" dy="18">1</tspan><tspan x="870" dy="18">/</tspan><tspan x="870" dy="18">0</tspan><tspan x="870" dy="18">1</tspan></text>
    </g>
    <rect x="40" y="30" width="880" height="280" fill="url(#scan)"/>
    <rect x="0" y="30" width="120" height="280" fill="#ffffff" opacity=".04" transform="skewX(-20)" class="sweep"/>
  </g>
  <rect x="40.5" y="30.5" width="879" height="279" rx="18" fill="none" stroke="url(#edge)" stroke-width="1.5" filter="url(#glow)"/>

  <!-- barra de título -->
  <line x1="40" y1="70" x2="920" y2="70" stroke="#ff0040" stroke-opacity=".25"/>
  <circle cx="72" cy="50" r="6" fill="#ff0040"/>
  <circle cx="94" cy="50" r="6" fill="#ff4d6d" opacity=".7"/>
  <circle cx="116" cy="50" r="6" fill="#ff8fa3" opacity=".45"/>
  <text x="480" y="55" text-anchor="middle" class="mono" font-size="13" fill="#9a9aa8">belentani@omega: ~/sistemas</text>

  <!-- líneas del terminal -->
  <g class="mono line">
    <text x="72" y="110" class="type l1"><tspan class="p">❯</tspan> <tspan class="k">whoami</tspan></text>
    <text x="72" y="140" class="type l2"><tspan class="w">Pedro Belentani</tspan> <tspan class="m">— arquitecto de sistemas de IA</tspan></text>
    <text x="72" y="178" class="type l3"><tspan class="p">❯</tspan> <tspan class="k">cat</tspan> stack.txt</text>
    <text x="72" y="208" class="type l4">TypeScript · Python · React · FastAPI · agentes · WebGPU</text>
    <text x="72" y="246" class="type l5"><tspan class="p">❯</tspan> <tspan class="k">echo</tspan> $UBICACION <tspan class="m">→</tspan> <tspan class="w">Barcelona</tspan> <tspan class="m">· PT · ES · EN · CA</tspan></text>
    <rect x="72" y="266" width="10" height="20" fill="#ff0040" class="cursor" filter="url(#glow)"/>
  </g>
</svg>

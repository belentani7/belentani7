services:
  bellentani-engine:
    build: .
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      BELLENTANI_DB: /app/data/bellentani.db
      BELLENTANI_ARTIFACTS: /app/data/artifacts
      BELLENTANI_WORKERS: "3"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
